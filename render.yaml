services:
  - type: web
    name: poker-play-backend
    runtime: node
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run prisma:migrate:deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: poker-play-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://poker-play-frontend.onrender.com

  - type: staticSite
    name: poker-play-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: https://poker-play-backend.onrender.com

databases:
  - name: poker-play-db
    plan: free
    region: oregon
