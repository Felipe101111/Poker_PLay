services:
  postgres:
    image: postgres:16-alpine
    container_name: poker_play_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker
      POSTGRES_DB: poker_play
    ports:
      - "5432:5432"
    volumes:
      - poker_play_pg_data:/var/lib/postgresql/data

volumes:
  poker_play_pg_data:
